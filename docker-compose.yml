services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-docker-faas/gateway:latest}
    container_name: ${GATEWAY_CONTAINER_NAME:-docker-faas-gateway}
    ports:
      - "${GATEWAY_HOST_BIND:-0.0.0.0}:${GATEWAY_HOST_PORT:-8080}:8080"   # Gateway API
      - "${METRICS_HOST_BIND:-0.0.0.0}:${METRICS_HOST_PORT:-9090}:9090"   # Metrics
    environment:
      - GATEWAY_PORT=8080
      - METRICS_PORT=9090
      - FUNCTIONS_NETWORK=${FUNCTIONS_NETWORK:-docker-faas-net}
      - FAAS_STRICT_CONTAINER_OWNERSHIP=${FAAS_STRICT_CONTAINER_OWNERSHIP:-false}
      - FAAS_ASYNC_CALLBACK_BLOCK_INTERNAL=${FAAS_ASYNC_CALLBACK_BLOCK_INTERNAL:-false}
      - GATEWAY_CONTAINER_NAME=${GATEWAY_CONTAINER_NAME:-docker-faas-gateway}
      - AUTH_ENABLED=true
      - AUTH_USER=admin
      - AUTH_PASSWORD=admin
      # OpenFaaS compatibility for /function/* (set true for strict auth in prod)
      - REQUIRE_AUTH_FOR_FUNCTIONS=false
      - LOG_LEVEL=info
      - STATE_DB_PATH=/data/docker-faas.db
      - READ_TIMEOUT=60s
      - WRITE_TIMEOUT=60s
      - EXEC_TIMEOUT=60s
      - DEFAULT_REPLICAS=1
      - MAX_REPLICAS=10
      # Debug settings - bind to localhost only for security
      - DEBUG_BIND_ADDRESS=127.0.0.1
      # Idle scale-to-zero (OFF by default; behavior stays plain OpenFaaS).
      # Enabling REQUIRES the dedicated activity-lease secret (fail-closed).
      # - IDLE_SCALE_TO_ZERO_ENABLED=true
      # - IDLE_DURATION_SECONDS=300
      # - IDLE_RECONCILE_SECONDS=30
      # - FAAS_ACTIVITY_LEASE_SECRET_FILE=/var/openfaas/secrets/activity-lease-secret
      # Rotation overlap + transport hardening (see docs/SCALE_EXTENSIONS_CONTRACT.md)
      # - FAAS_ACTIVITY_LEASE_SECRET_PREVIOUS_FILE=/var/openfaas/secrets/activity-lease-secret-previous
      # - FAAS_ACTIVITY_LEASE_MAX_SKEW=2m
      # - FAAS_ACTIVITY_LEASE_BODY_LIMIT=65536
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - faas-data:/data
      - faas-secrets:/var/openfaas/secrets
      - ./web/static:/app/web/static:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - docker-faas-net
    restart: unless-stopped

networks:
  docker-faas-net:
    name: ${GATEWAY_NETWORK_NAME:-docker-faas-net}
    driver: bridge

volumes:
  faas-data:
    name: ${FAAS_DATA_VOLUME:-docker-faas-data}
  faas-secrets:
    name: ${FAAS_SECRETS_VOLUME:-docker-faas-secrets}
